name: Build Android

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (e.g. 20260611)"
        required: true
        default: "20260611"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Ensure Target for Active Toolchain
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set UCI Version
        shell: bash
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["UCI_DATE"]

          if not version.isdigit():
              raise SystemExit(
                  "uci_date must contain digits only, e.g. 20260918"
              )

          if len(version) != 8:
              raise SystemExit(
                  "uci_date must be exactly 8 digits, e.g. 20260918"
              )

          # Lunar's UCI version is defined as:
          #
          # const VERSION: &str = env!("CARGO_PKG_VERSION");
          #
          # Do NOT modify Cargo.toml because Cargo requires a valid
          # semantic version. Instead, replace the source constant
          # with the manually supplied date for this CI build.

          candidates = []

          for path in Path(".").rglob("*.rs"):
              if any(part in {".git", "target"} for part in path.parts):
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if 'const VERSION: &str = env!("CARGO_PKG_VERSION");' in text:
                  candidates.append(path)

          if len(candidates) == 0:
              raise SystemExit(
                  'Could not find Lunar UCI version line: '
                  'const VERSION: &str = env!("CARGO_PKG_VERSION");'
              )

          if len(candidates) > 1:
              raise SystemExit(
                  "Found multiple possible Lunar UCI version lines:\n"
                  + "\n".join(str(p) for p in candidates)
              )

          path = candidates[0]
          text = path.read_text(encoding="utf-8")

          old = 'const VERSION: &str = env!("CARGO_PKG_VERSION");'
          new = f'const VERSION: &str = "{version}";'

          if old not in text:
              raise SystemExit(
                  f"Expected version line was not found in {path}"
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          print(f"Patched Lunar UCI version in {path}")
          print(f"UCI version: {version}")
          PY

          echo "VERSION=${UCI_DATE}" >> "$GITHUB_ENV"

      - name: Show Patched UCI Version
        run: |
          grep -R 'const VERSION' --include='*.rs' -n . \
            --exclude-dir=.git \
            --exclude-dir=target || true

      - name: Build Lunar for Android
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: ""
        run: |
          cargo ndk -t arm64-v8a --platform 24 build \
            --release \
            --config 'build.rustflags=[]' \
            --config 'target.aarch64-linux-android.rustflags=[]'

          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/lunar dist/bin/lunar

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-android-arm64
          path: dist/bin/*
